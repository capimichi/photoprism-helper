[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoprism-helper"
version = "0.1.0"
description = "Helper CLI to index PhotoPrism media into MariaDB, analyze storage, optimize heavy videos and tag by source folders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9.0",
    "cryptography>=42.0",
    "injector>=0.22,<1.0",
    "pydantic>=2.5,<3.0",
    "pymysql>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "tabulate>=0.9.0",
]

[project.scripts]
photoprismhelper = "photoprismhelper.cli:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["photoprismhelper*"]
